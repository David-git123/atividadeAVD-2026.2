[theme]
base = "dark"
primaryColor = "#D4AF37"             # Dourado (widgets, seleções e destaques)
backgroundColor = "#0A192F"          # Azul escuro (fundo principal da página)
secondaryBackgroundColor = "#4A0E2E"  # Vinho (fundo da sidebar e contêineres)
textColor = "#E8A5B8"                # Tom vinho claro (garante legibilidade sobre o azul escuro)
font = "sans serif"